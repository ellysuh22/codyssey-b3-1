# B3-1 web server - Nginx main config (Amazon Linux 2023)
# Deploy: /etc/nginx/nginx.conf  (validate with `sudo nginx -t` before reload)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    types_hash_max_size 4096;  # mime.types is large; avoids the nginx -t types_hash warning
    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;   # hide Nginx version in headers and error pages

    server {
        listen      80 default_server;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Health check: fixed 200 / text/plain / "OK"
        location = /health {
            access_log   off;
            default_type text/plain;
            add_header   Cache-Control "no-store" always;
            return 200 "OK\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="600" y="22" text-anchor="middle" font-size="16" fill="#64748b">B3-1 아키텍처 · 외부 요청 → 웹 서버 트래픽 흐름</text>

  <!-- 외부 사용자 -->
  <rect x="170" y="40" width="300" height="64" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">사용자 (누구나)</text>
  <text x="320" y="92" text-anchor="middle" font-size="14" fill="#1e40af">브라우저 · curl → HTTP :80</text>

  <rect x="730" y="40" width="300" height="64" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="880" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#7c2d12">관리자 PC (내 IP)</text>
  <text x="880" y="92" text-anchor="middle" font-size="14" fill="#9a3412">ssh -i key.pem → SSH :22</text>

  <!-- 인터넷 -->
  <ellipse cx="600" cy="170" rx="130" ry="38" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="600" y="177" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Internet</text>

  <path d="M320,104 L490,150" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <path d="M880,104 L710,150" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#orange)"/>

  <!-- 리전 -->
  <rect x="40" y="240" width="1120" height="620" rx="16" fill="#fafafa" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="268" font-size="16" font-weight="700" fill="#334155">AWS Cloud · 서울 리전 (ap-northeast-2)</text>

  <!-- VPC -->
  <rect x="70" y="310" width="1060" height="530" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="90" y="350" font-size="18" font-weight="700" fill="#14532d">VPC  b3-1-vpc</text>
  <text x="90" y="372" font-size="14" fill="#166534">10.0.0.0/16 · 격리된 나만의 네트워크</text>

  <!-- Internet -> IGW -->
  <path d="M600,208 L600,280" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>

  <!-- IGW (VPC 경계에 걸침) -->
  <rect x="490" y="283" width="220" height="54" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="600" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Internet Gateway</text>
  <text x="600" y="326" text-anchor="middle" font-size="13" fill="#ede9fe">b3-1-igw · VPC의 정문</text>

  <!-- Route Table -->
  <rect x="100" y="410" width="290" height="150" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="245" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#164e63">Route Table (public)</text>
  <line x1="120" y1="452" x2="370" y2="452" stroke="#cbd5e1"/>
  <text x="120" y="480" font-size="14" fill="#0f172a">목적지</text>
  <text x="270" y="480" font-size="14" fill="#0f172a">대상</text>
  <text x="120" y="508" font-size="14" font-family="Menlo, monospace" fill="#0e7490">0.0.0.0/0</text>
  <text x="270" y="508" font-size="14" font-family="Menlo, monospace" fill="#0e7490">igw-…</text>
  <text x="120" y="534" font-size="14" font-family="Menlo, monospace" fill="#475569">10.0.0.0/16</text>
  <text x="270" y="534" font-size="14" font-family="Menlo, monospace" fill="#475569">local</text>
  <path d="M390,485 L425,485" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="245" y="585" text-anchor="middle" font-size="13" fill="#0e7490">퍼블릭 서브넷에 연결됨</text>

  <!-- Public Subnet -->
  <rect x="425" y="390" width="680" height="425" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="445" y="418" font-size="16" font-weight="700" fill="#164e63">Public Subnet  10.0.1.0/24</text>
  <text x="1085" y="418" text-anchor="end" font-size="13" fill="#0e7490">퍼블릭 IP 자동 할당 ON</text>

  <!-- Security Group -->
  <rect x="460" y="440" width="610" height="350" rx="10" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="480" y="468" font-size="16" font-weight="700" fill="#991b1b">Security Group  b3-1-web-sg</text>
  <rect x="480" y="482" width="570" height="62" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="496" y="507" font-size="14" fill="#1e3a8a">IN  HTTP 80  ← 0.0.0.0/0   (누구나)</text>
  <text x="496" y="531" font-size="14" fill="#9a3412">IN  SSH  22  ← 내 IP/32     (관리자만)</text>
  <text x="1036" y="519" text-anchor="end" font-size="13" fill="#991b1b">그 외 전부 차단</text>

  <!-- IGW -> EC2 경로 -->
  <path d="M600,337 L600,378 L820,378 L820,580" stroke="#2563eb" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#blue)"/>

  <!-- EC2 -->
  <rect x="560" y="585" width="420" height="180" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="770" y="618" text-anchor="middle" font-size="19" font-weight="700" fill="#7c2d12">EC2  b3-1-web</text>
  <text x="770" y="646" text-anchor="middle" font-size="14" fill="#9a3412">t3.micro · Ubuntu 24.04 LTS · EBS 8GiB</text>
  <rect x="610" y="662" width="320" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="770" y="686" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Nginx :80</text>
  <text x="770" y="707" text-anchor="middle" font-size="13" font-family="Menlo, monospace" fill="#166534">/  → Hello Cloud   /health → OK</text>
  <text x="770" y="748" text-anchor="middle" font-size="14" fill="#7c2d12">Public IP: x.x.x.x · Private IP: 10.0.1.x</text>

  <!-- 단계 번호 -->
  <g font-size="14" font-weight="700" fill="#ffffff">
    <circle cx="565" cy="245" r="13" fill="#2563eb"/><text x="565" y="250" text-anchor="middle">1</text>
    <circle cx="575" cy="360" r="13" fill="#2563eb"/><text x="575" y="365" text-anchor="middle">2</text>
    <circle cx="845" cy="440" r="13" fill="#2563eb"/><text x="845" y="445" text-anchor="middle">3</text>
    <circle cx="845" cy="565" r="13" fill="#2563eb"/><text x="845" y="570" text-anchor="middle">4</text>
  </g>

  <!-- 하단: 요청 흐름 + IAM -->
  <rect x="40" y="880" width="700" height="100" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="908" font-size="15" font-weight="700" fill="#1e3a8a">요청 흐름 (하나라도 빠지면 접속 실패)</text>
  <text x="60" y="934" font-size="14" fill="#1e40af">① IGW가 VPC에 연결  →  ② Route Table 0.0.0.0/0 → IGW</text>
  <text x="60" y="958" font-size="14" fill="#1e40af">③ Security Group 80 허용  →  ④ EC2 퍼블릭 IP + Nginx 실행</text>

  <rect x="760" y="880" width="400" height="100" rx="12" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="780" y="908" font-size="15" font-weight="700" fill="#581c87">IAM (계정 전역) · b3-1-practice</text>
  <text x="780" y="934" font-size="14" fill="#6b21a8">EC2 · VPC · SG 작업만 허용 (서울 리전)</text>
  <text x="780" y="958" font-size="14" fill="#6b21a8">S3 · RDS · AdministratorAccess 없음</text>
</svg>
